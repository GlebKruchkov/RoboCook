version: '3'
services:
  ros-dev:
    image: osrf/ros:noetic-desktop-full
    container_name: ros_development
    environment:
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./ros_ws:/home/ros/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /home/ros/ws
    stdin_open: true
    tty: true
    network_mode: host